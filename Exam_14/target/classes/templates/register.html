<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Store - Register</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="navbar">
    <div class="logo">Book Store</div>
    <nav>
        <a th:href="@{/}">Home</a>
        <a th:href="@{/catalog}">Catalog</a>
        <a th:href="@{/login}">Login</a>
        <a th:href="@{/register}">Register</a>
    </nav>
</header>

<section class="form-section">
    <form class="form-card" th:action="@{/register}" th:object="${user}" method="post">
        <h1>Registration</h1>
        <p class="success" th:if="${successMessage}" th:text="${successMessage}"></p>

        <label>Name</label>
        <input type="text" th:field="*{name}" placeholder="Enter your name">
        <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>

        <label>Email</label>
        <input type="email" th:field="*{email}" placeholder="Enter your email">
        <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>

        <label>Password</label>
        <input type="password" th:field="*{password}" placeholder="Create password">
        <span class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>

        <button type="submit" class="btn">Register</button>
    </form>
</section>
</body>
</html>
