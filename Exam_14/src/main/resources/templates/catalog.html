<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Store - Catalog</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="navbar">
    <div class="logo">Book Store</div>
    <nav>
        <a th:href="@{/}">Home</a>
        <a th:href="@{/catalog}">Catalog</a>
        <a th:href="@{/cart}">Cart (<span th:text="${cartCount}">0</span>)</a>
        <a th:href="@{/login}">Login</a>
        <a th:href="@{/register}">Register</a>
    </nav>
</header>

<section class="section">
    <h1>Book Catalog</h1>
    <div class="book-grid">
        <div class="book-card" th:each="book : ${books}">
            <img th:src="${book.imageUrl}" th:alt="${book.title}">
            <h3 th:text="${book.title}"></h3>
            <p th:text="${book.author}"></p>
            <p class="price">Rs. <span th:text="${book.price}"></span></p>
            <form th:action="@{/cart/add/{bookId}(bookId=${book.id})}" method="post">
                <button type="submit" class="btn small-btn">Add to Cart</button>
            </form>
        </div>
    </div>
</section>
</body>
</html>
