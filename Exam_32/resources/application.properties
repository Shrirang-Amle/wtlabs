# ================================
# Application Configuration
# ================================
spring.application.name=Exam_32

# ================================
# H2 In-Memory Database
# ================================
spring.datasource.url=jdbc:h2:mem:exam32db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=ShriRam@24
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ================================
# H2 Console (browser access)
# ================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ================================
# JPA / Hibernate
# ================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ================================
# Server
# ================================
server.port=8080

# ================================
# Logging
# ================================
logging.level.com.exam32=DEBUG
logging.level.org.springframework.security=INFO
