<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Store - Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="navbar">
    <div class="logo">Book Store</div>
    <nav>
        <a th:href="@{/}">Home</a>
        <a th:href="@{/catalog}">Catalog</a>
        <a th:href="@{/login}">Login</a>
        <a th:href="@{/register}">Register</a>
    </nav>
</header>

<section class="form-section">
    <form class="form-card" th:action="@{/login}" method="post">
        <h1>Login</h1>
        <p class="success" th:if="${successMessage}" th:text="${successMessage}"></p>
        <p class="error" th:if="${errorMessage}" th:text="${errorMessage}"></p>

        <label>Email</label>
        <input type="email" name="email" placeholder="Enter your email" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="Enter your password" required>

        <button type="submit" class="btn">Login</button>
    </form>
</section>
</body>
</html>
