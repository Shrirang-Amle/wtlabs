<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Register – Secure App</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="card-header">
            <h1>📝 Create Account</h1>
            <p>Register a new account</p>
        </div>

        <div th:if="${registrationError}" class="alert alert-danger"
             th:text="${registrationError}"></div>

        <form th:action="@{/register}" method="post" class="form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username"
                       placeholder="Choose a username"
                       required minlength="3" maxlength="50"
                       autocomplete="username"/>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email"
                       placeholder="your@email.com"
                       required autocomplete="email"/>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       placeholder="Choose a strong password"
                       required minlength="6"
                       autocomplete="new-password"/>
            </div>

            <button type="submit" class="btn btn-primary btn-full">Create Account</button>
        </form>

        <div class="card-footer">
            <p>Already have an account? <a th:href="@{/login}">Sign in</a></p>
        </div>
    </div>
</div>
</body>
</html>
